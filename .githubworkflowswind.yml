name: Actualizar viento

on:
  schedule:
    # GFS publica ~3.5-4 h después de 00/06/12/18 UTC
    - cron: "40 3,9,15,21 * * *"
  workflow_dispatch: {}          # botón "Run workflow" para probar

permissions:
  contents: write

jobs:
  wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libeccodes0
          pip install numpy xarray cfgrib

      - name: Generar wind.json
        run: python scripts/make_wind.py wind.json

      - name: Publicar en la rama wind-data (una sola confirmación, no crece el repo)
        run: |
          mkdir out && cp wind.json out/ && touch out/.nojekyll
          cd out
          git init -q -b wind-data
          git config user.name  "wind-bot"
          git config user.email "wind-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "viento $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" wind-data
