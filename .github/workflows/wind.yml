name: Actualizar viento
on:
  schedule:
    - cron: "15 */6 * * *"   # cada 6 horas (hora UTC)
  workflow_dispatch:          # botón manual "Run workflow"
permissions:
  contents: write
jobs:
  wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_wind.py
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/wind.json
          git diff --staged --quiet || (git commit -m "viento $(date -u +%F_%H:%M)" && git push)
